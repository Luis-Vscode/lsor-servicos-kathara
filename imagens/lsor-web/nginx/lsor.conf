server {
    listen 80 default_server;
    server_name lsor-luis-agatha.local;

    root /var/www/lsor;
    index index.html;

    access_log /var/log/nginx/lsor-access.log;
    error_log  /var/log/nginx/lsor-error.log;

    location = /api/status {
        default_type application/json;
        return 200 '{"status":"ok","servico":"lsor-web","integrantes":["Luis Gustavo Dos Anjos Correia e Rocha","Agatha Marinho Santos"]}\n';
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
